# AI-upscale asset pipeline config (developer-only).
#
# [pipeline] holds the defaults applied to every clip. Add optional
# [clip:<name>] sections to override settings for a single cinematic, so you can
# MIX models across clips (e.g. an illustrative model for faction clips, a
# general model for the live-action-style ones). Resolution per clip:
#     [clip:<name>]  ->  [pipeline]
#
# Tool paths are anchored at this directory (work\video-upscale\) when relative, so
# the drop-in tools live in work\video-upscale\tools\ (gitignored; see README.md).

[pipeline]
# Full, ENCODE-capable ffmpeg/ffprobe (NOT the slim decode-only runtime build).
Ffmpeg  = tools\ffmpeg\bin\ffmpeg.exe
Ffprobe = tools\ffmpeg\bin\ffprobe.exe

# The swappable upscaler. Placeholders: {in} {out} {scale} {model}.
# Real-ESRGAN ncnn-vulkan batch mode (-i/-o accept directories). Swap this line
# for video2x / waifu2x / etc. without touching build_hd_pack.py.
UpscaleCmd = tools\realesrgan\realesrgan-ncnn-vulkan.exe -i {in} -o {out} -s {scale} -n {model} -f png

# Upscale model + factor, and the H.264 quality (lower CRF = higher quality/size).
# Model chosen after an A/B sweep on the test set (see testset.txt): realesrgan-x4plus
# gave the best result across all clips (crispest detail). x4plus is x4-only -> Scale=4.
Model = realesrgan-x4plus
Scale = 4
Crf   = 20

# Where the finished .mp4 pack lands. Default (blank) = <repo>\dist\movies-hd.
OutDir =

# Source .wve directory. Default (blank) = <game install>\movies (via config.py).
MoviesDir =

# --- Per-clip overrides (optional) --------------------------------------------
# realesrgan-x4plus is the global default (chosen by the A/B sweep). Add a
# [clip:<name>] section only to MIX a different model on a specific cinematic,
# e.g. if one clip looks better with another model. Resolution: [clip:] -> [pipeline].
# Test set for re-evaluating models later (build just these with
#   run-build-hd-pack.bat --list video-upscale\testset.txt):  openingx, gaians.

# These clips looked best on the video-tuned model (A/B at CRF 20,
# x4plus | animevideov3 | x4plus-anime 3-up; user picked animevideov3 for all).
[clip:citizensDefense]
Model = realesr-animevideov3

[clip:cloningVats]
Model = realesr-animevideov3

[clip:close_ct]
Model = realesr-animevideov3

[clip:close_us]
Model = realesr-animevideov3

[clip:commandNexus]
Model = realesr-animevideov3

[clip:empathGuild]
Model = realesr-animevideov3

[clip:longevityVaccine]
Model = realesr-animevideov3

[clip:networkBackbone]
Model = realesr-animevideov3

[clip:neuralAmplifier]
