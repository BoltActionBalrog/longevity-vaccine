[pytest]
testpaths = .
python_files = test_*.py
# -n auto / --dist loadgroup: how many workers and which tests share one are decided from the measured cost of every
# test (timings/costs.json) -- see xdist_sched.py. A whole-directory run is parallel; a targeted run is parallel
# only when its tests cost enough to pay for the workers.
# -p no:faulthandler: unicorn raises (and itself handles) thousands of first-chance access violations; faulthandler
# dumps every thread's stack for each one, from inside the exception handler, and under 48 workers that dumping
# killed workers outright ("stack overflow", node down) -- 3 of 3 runs with it on crashed or hung, none with it off.
# --max-worker-restart=0: a worker that dies anyway FAILS the run at once. With restarts, xdist's replacement worker
# never received the dead worker's remaining module group, and the run hung forever with every worker idle.
addopts = -q -n auto --dist loadgroup --max-worker-restart=0 -p no:faulthandler
# Keep the tmp_path dirs of FAILED tests only; a passed test's dir is deleted by its own worker as it finishes, in
# parallel. With the default ("all", 3 runs kept) every run ended by deleting the run-before-last's whole tree --
# ~40,000 files (installer copies), one thread, ~20 s of every full run.
tmp_path_retention_policy = failed
