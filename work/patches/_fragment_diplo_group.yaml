  - id: diplo_talk_scale
    description: >
      DIPLOMACY talk screen: the anchored speech box (DiploTalkWin 700x450 window, backdrop/title/text-block
      frames + strokes, header/art column/row gap/OK row/measure width anchored arms) and the console-strip
      content under it (3 fonts, panel rect table, BIOSCAN/status/HQ painters, faction logo/colour bar/HQ
      picture/bezel sprite ratios, the two flics dst-bounced, DATALINKS/PROFILE/HQINFO frame zoom) all scale
      vanilla x g/16; g<=16 native no-op.  Proto hook_diplo_proto.js v9d/v10 user-verified 4K+1600 2026-08-17/18.
      src assemble_diplo.py: sequential thunks pcave2 0x11590..0x12750, cells 0x11560; fixed blocks
      t_dp_itemrect 0x45b0, t_cr_snap 0x127b0, t_cr_mark 0x17080, t_cr_tile_exit 0x170b0, t_cr_tile 0x17350, t_dp_q16anch 0x30850, t_dp_status_fit 0x30b00, t_dp_status_tail 0x30c00;
      cells 0x12790 (save-under), 0x27c28 (status fit).  Also repoints 8 existing
      sites at anchored-gate wrappers (see EXISTING_REPOINTS) and prefixes thunk_btn_gate (v8).
      PLUS the console save-under (proto v6 user-verified 4K 2026-08-20): t_cr_snap on the iface vtbl
      snapshots the strip's centre column on diplo enter; t_cr_tile wraps all 12 tile_panels callers and
      blits it back after every armed normal-mode pass (this==MainWin gate), fixing the exit residue.
      PLUS the status-line fit (2026-10-11): t_dp_status_fit at 0x43FE07 steps the +0xA44 font down until
      'DIPLOMATIC STATUS: <treaty>' fits one line wherever vanilla shows one line (law diplo_status_font_size).
